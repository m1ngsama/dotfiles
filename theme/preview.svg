<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">m1ngsama dotfiles — Solarized Osaka palette preview</title>
  <desc id="desc">A terminal-inspired preview using the repository's locked Solarized Osaka colors.</desc>
  <rect width="960" height="260" rx="18" fill="#001419"/>
  <rect x="1" y="1" width="958" height="258" rx="17" fill="none" stroke="#063540" stroke-width="2"/>

  <circle cx="36" cy="32" r="7" fill="#db302d"/>
  <circle cx="60" cy="32" r="7" fill="#b28500"/>
  <circle cx="84" cy="32" r="7" fill="#849900"/>
  <text x="480" y="38" fill="#576d74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">dotfiles — fish · tmux · neovim · i3</text>

  <text x="42" y="102" fill="#9eabac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29" font-weight="600">m1ngsama</text>
  <text x="212" y="102" fill="#576d74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29">/</text>
  <text x="244" y="102" fill="#29a298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29" font-weight="600">dotfiles</text>

  <text x="42" y="148" fill="#268bd3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">➜</text>
  <text x="76" y="148" fill="#839395" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">~ git:</text>
  <text x="162" y="148" fill="#d23681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">(main)</text>
  <text x="242" y="148" fill="#b28500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">*</text>
  <rect x="268" y="128" width="11" height="25" fill="#ede7d3"/>

