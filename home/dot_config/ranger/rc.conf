# Small overrides on top of ranger's packaged defaults.
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh

set vcs_aware true
set preview_images false
set collapse_preview false
set wrap_plaintext_previews true
set draw_borders both

# Chafa is the portable default; graphical image methods remain terminal-local.
# Ranger keeps its built-in dT trash binding, while uT restores trashed files.
map uT shell -w if command -v trash-restore >/dev/null 2>&1; then trash-restore; else printf 'trash-restore is unavailable\n' >&2; fi
