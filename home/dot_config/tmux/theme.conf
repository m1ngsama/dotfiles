# Solarized Osaka palette from the repository's locked solarized-osaka.nvim
# commit f796014c14b1910e08d42cc2077fef34f08e0295. Red is reserved for bells.

set-option -g mode-style 'fg=#001419,bg=#29a298,bold'
set-option -g message-style 'fg=#ede7d3,bg=#002c38'
set-option -g message-command-style 'fg=#001419,bg=#b28500,bold'

set-option -g pane-border-style 'fg=#002c38,bg=default'
set-option -g pane-active-border-style 'fg=#268bd3,bg=default'
set-window-option -g window-style default
set-window-option -g window-active-style default

set-option -g display-panes-active-colour '#268bd3'
set-option -g display-panes-colour '#9eabac'
set-window-option -g clock-mode-colour '#849900'

set-option -g status on
set-option -g status-interval 5
set-option -g status-justify left
set-option -g status-style 'fg=#9eabac,bg=#001419'
set-option -g status-left-length 100
set-option -g status-right-length 100
set-option -g status-left-style default
set-option -g status-right-style default

set-option -g status-left '#[fg=#001419,bg=#b28500,bold] #S #[fg=#b28500,bg=#002c38,nobold]#[fg=#9eabac,bg=#002c38] #{USER} #[fg=#002c38,bg=#001419]'
set-option -g status-right '#[fg=#002c38,bg=#001419]#[fg=#9eabac,bg=#002c38,bold] #h '

set-window-option -g window-status-separator ''
set-window-option -g window-status-style 'fg=#839395,bg=#001419'
set-window-option -g window-status-current-style 'fg=#001419,bg=#268bd3,bold'
set-window-option -g window-status-activity-style 'fg=#29a298,bg=#001419,underscore'
set-window-option -g window-status-bell-style 'fg=#ffffff,bg=#db302d,bold'
set-window-option -g window-status-format ' #I  #{b:pane_current_path} '
set-window-option -g window-status-current-format ' #I  #{b:pane_current_path} '
