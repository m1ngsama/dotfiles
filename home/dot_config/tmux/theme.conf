set -g mode-style 'fg=#ede7d3,bg=#073541'
set -g message-style 'fg=#ede7d3,bg=#073541'
set -g message-command-style 'fg=#ede7d3,bg=#073541'

set -g pane-border-style 'fg=#073541'
set -g pane-active-border-style 'fg=#ede7d3'

set -g display-panes-active-colour '#268bd3'
set -g display-panes-colour '#9eabac'
setw -g clock-mode-colour '#849900'

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style 'fg=#586e74,bg=#002c38'
set -g status-left-length 100
set -g status-right-length 100
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left '#[fg=#073541,bg=#ede7d3,bold] #S #[fg=#ede7d3,bg=#9eabac,nobold]#[fg=#001419,bg=#9eabac,bold] #{USER} #[fg=#9eabac,bg=#002c38,nobold]'
set -g status-right '#[fg=#586e74,bg=#002c38]#[fg=#647a82,bg=#586e74]#[fg=#9eabac,bg=#647a82]#[fg=#001419,bg=#9eabac,bold] #h '

setw -g window-status-separator ''
setw -g window-status-style 'NONE,fg=#839395,bg=#002c38'
setw -g window-status-activity-style 'underscore,fg=#839395,bg=#002c38'
setw -g window-status-bell-style 'fg=#ffffff,bg=#db302d,bold'
setw -g window-status-format '  #I  #{b:pane_current_path}  '
setw -g window-status-current-format '#[fg=#002c38,bg=#ede7d3]#[fg=#b28500,bg=#ede7d3,bold] #I #[fg=#ede7d3,bg=#b28500] #{b:pane_current_path} #[fg=#b28500,bg=#002c38,nobold]'
