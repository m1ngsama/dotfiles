# Requires tmux 3.2+ (`display-popup`, `source-file -F`, and `current_file`).
# Prefer tmux's own terminfo entry while retaining a safe minimal fallback.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set-option -g default-terminal tmux-256color' \
  'set-option -g default-terminal screen-256color'

# Rebuild terminal capabilities on every reload so append operations remain
# idempotent. The macOS fragment adds its capabilities after this reset.
set-option -gu terminal-features
set-option -gu terminal-overrides
set-option -as terminal-features ',alacritty:RGB,xterm*:RGB'
set-option -as terminal-overrides ',alacritty:Tc,*256col*:Tc'

# Remember the file that was actually sourced. This keeps reload and adjacent
# fragments independent of $HOME and $XDG_CONFIG_HOME.
set-option -gF @dotfiles_config_file '#{current_file}'

#### Prefix and key bindings

unbind -q C-b
set-option -g prefix C-t
set-option -g repeat-time 500
set-option -g focus-events on
set-window-option -g mode-keys vi

bind r source-file -F '#{@dotfiles_config_file}' \; display-message 'Reloaded #{@dotfiles_config_file}'

# Open the current directory with the platform's standard desktop opener.
bind o run-shell 'if command -v open >/dev/null 2>&1; then open #{q:pane_current_path}; elif command -v xdg-open >/dev/null 2>&1; then xdg-open #{q:pane_current_path}; else tmux display-message "No directory opener found (open/xdg-open)"; fi'
bind -r e kill-pane -a

# Pane navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Pane and window lifecycle.
bind | split-window -h
bind - split-window -v
bind x kill-pane
bind X kill-window

#### Core behavior

set-option -g history-limit 64096
set-option -sg escape-time 10
set-option -g set-titles on
set-option -g set-titles-string '#T'

# Load only adjacent fragments. macOS behavior remains conditional and does
# not affect Linux or other Unix hosts.
if-shell 'test "$(uname -s)" = Darwin' 'source-file -F "#{d:current_file}/macos.conf"'
source-file -F '#{d:current_file}/theme.conf'
source-file -F '#{d:current_file}/utility.conf'
