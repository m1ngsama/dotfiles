# Open lazygit in the current pane's directory when available. A missing
# optional dependency produces an actionable tmux message instead of a failed
# popup or a shell error.
bind -r g if-shell 'command -v lazygit >/dev/null 2>&1' \
  'display-popup -d "#{pane_current_path}" -w 80% -h 80% -E lazygit' \
  'display-message "lazygit is not installed; install it to enable prefix + g"'
