# Classic Solarized Dark palette. Red is reserved for bells.

set-option -g mode-style 'fg=#eee8d5,bg=#073642'
set-option -g message-style 'fg=#eee8d5,bg=#073642'
set-option -g message-command-style 'fg=#eee8d5,bg=#073642'

set-option -g pane-border-style 'fg=#073642,bg=default'
set-option -g pane-active-border-style 'fg=#eee8d5,bg=default'
set-window-option -g window-style default
set-window-option -g window-active-style default

set-option -g display-panes-active-colour '#268bd3'
set-option -g display-panes-colour '#9eabac'
set-window-option -g clock-mode-colour '#849900'

set-option -g status on
set-option -g status-interval 1
set-option -g status-justify left
set-option -g status-style 'fg=#586e75,bg=#002b36'
set-option -g status-left-length 100
set-option -g status-right-length 100
set-option -g status-left-style none
set-option -g status-right-style none

set-option -g status-left '#[fg=#073642,bg=#eee8d5,bold] #S #[fg=#eee8d5,bg=#93a1a1,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#93a1a1,bold] #{USER} #[fg=#93a1a1,bg=#002b36]'
set-option -g status-right '#[fg=#586e75,bg=#002b36,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#586e75]#[fg=#657b83,bg=#586e75,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#657b83]#[fg=#93a1a1,bg=#657b83,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#93a1a1,bold] #h '

set-window-option -g window-status-separator ''
set-window-option -g window-status-style 'none,fg=#839496,bg=#002b36'
set-window-option -g window-status-current-style bold
set-window-option -g window-status-activity-style 'underscore,fg=#839496,bg=#002b36'
set-window-option -g window-status-bell-style 'fg=#ffffff,bg=#db302d,bold'
set-window-option -g window-status-format '#[fg=#002b36,bg=#002b36]#[default] #I  #{b:pane_current_path} #[fg=#002b36,bg=#002b36,nobold,nounderscore,noitalics]'
set-window-option -g window-status-current-format '#[fg=#002b36,bg=#eee8d5]#[fg=#b58900,bg=#eee8d5] #I #[fg=#eee8d5,bg=#b58900] #{b:pane_current_path} #[fg=#b58900,bg=#002b36,nobold]'
